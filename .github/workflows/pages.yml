name: Publicar site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar manifestos JSON
        run: |
          python -m json.tool updates/latest.json > /dev/null
          python -m json.tool updates/releases.json > /dev/null
      - name: Validar arquivos obrigatórios
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s assets/trakino.png

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar conteúdo público
        run: |
          mkdir _site
          cp index.html privacidade.html termos.html .nojekyll _site/
          cp -R assets updates _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
